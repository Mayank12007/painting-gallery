services:
  - type: web
    name: gallerist-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: gallerist2024secretkey
      - key: PORT
        value: 10000
